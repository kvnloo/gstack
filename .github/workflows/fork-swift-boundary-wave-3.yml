name: Fork Swift acceptance diagnosis
# Both baseline and activity candidate have saved full-free exit code 1.
# Isolate the actual failing files; do not relax assertions or test timeouts.
on:
  push:
    branches: [investigate/swift-boundary-wave-3-20260925]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-swift-boundary-wave-3
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  NO_COLOR: '1'
  BASE: 730a1017d1a15a8c0c214b820b3865b6e2a32547
  INPUTS: d552ddfba7f51bc0d33cb1f384390841045b844f
jobs:
  isolate-swift:
    if: github.repository == 'kvnloo/gstack'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Pin the exact source and preserve both original failing fixtures
        run: |
          mkdir -p evidence
          test "$(git rev-parse HEAD^)" = "$INPUTS"
          test "$(git hash-object browse/src/activity.ts)" = b15eb45a1d1c2bf5ae57f832418a0d7aa40a0f52
          test "$(git hash-object ios-qa/scripts/gen-accessors.test.ts)" = 1ed68e6532681f56d5f77ad328872ada95d2724b
          test "$(git hash-object test/ios-qa-regen.test.ts)" = 2aa39884c8f9c12588dfc6d751b535b75aedbc42
          git rev-parse HEAD > evidence/validation-commit.txt
          printf '%s\n' "$BASE" > evidence/base-commit.txt
          printf '%s\n' '${{ matrix.variant }}' > evidence/variant.txt
          bun install --frozen-lockfile
          if [[ '${{ matrix.variant }}' == candidate ]]; then
            python3 .context/perf-wave-1/prepare.py
            rm browse/src/.wave1-activity-baseline.ts
            test "$(git hash-object browse/src/activity.ts)" = df4b09fbc08a88020423f5c76f540eb7b115b69c
          fi
          git diff --check
          git diff -- browse/src/activity.ts > evidence/candidate.patch
          git config --global user.name 'Fork Validation'
          git config --global user.email 'fork-validation@gstack.test'
          git config --global init.defaultBranch main
      - name: Require a real Swift toolchain rather than silently skipping its checks
        run: |
          command -v swiftc
          command -v swift
          timeout 30s swiftc --version 2>&1 | tee evidence/swiftc-version.txt
          timeout 30s swift --version 2>&1 | tee evidence/swift-version.txt
          bun --version > evidence/bun-version.txt
          free -m > evidence/memory-before.txt
      - name: Run each unchanged fixture twice, in reversed order
        run: |
          files=(ios-qa/scripts/gen-accessors.test.ts test/ios-qa-regen.test.ts test/ios-qa-regen.test.ts ios-qa/scripts/gen-accessors.test.ts)
          printf 'trial\tfile\texit\ttee_exit\telapsed_seconds\n' > evidence/trials.tsv
          failed=0
          for index in "${!files[@]}"; do
            file=${files[$index]}
            trial=$((index + 1))
            start=$SECONDS
            set +e
            timeout -k 30s 360s bun test --timeout=30000 "$file" 2>&1 | tee "evidence/trial-$trial.log"
            codes=("${PIPESTATUS[@]}")
            set -e
            printf '%s\t%s\t%s\t%s\t%s\n' "$trial" "$file" "${codes[0]}" "${codes[1]}" "$((SECONDS - start))" >> evidence/trials.tsv
            if [[ "${codes[0]}" != 0 || "${codes[1]}" != 0 ]]; then failed=1; fi
          done
          cat evidence/trials.tsv
          printf '%s\n' "$failed" > evidence/diagnostic-exit.txt
          test "$(git hash-object ios-qa/scripts/gen-accessors.test.ts)" = 1ed68e6532681f56d5f77ad328872ada95d2724b
          test "$(git hash-object test/ios-qa-regen.test.ts)" = 2aa39884c8f9c12588dfc6d751b535b75aedbc42
          exit "$failed"
      - name: Record original failures and comparison limits
        if: always()
        run: |
          mkdir -p evidence
          printf '%s\n' \
            'Original run 36096477246: saved baseline and candidate full-free exit codes are both 1.' \
            'Both failed the Observable Swift typecheck; baseline also timed out on package regeneration.' \
            'Do not interpret a successful API job summary as overriding those raw failed receipts.' \
            'This run changes neither failing test nor its subprocess/test timeout.' \
            'Four per-variant isolated trials; not a full-suite rerun or proof of a contention cause.' \
            'A missing Swift toolchain is a failed diagnostic prerequisite, not a passing skipped check.' \
            'AI-assisted fork-only diagnosis; no new upstream PR or production edit committed.' \
            > evidence/LIMITATIONS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: swift-boundary-wave-3-${{ matrix.variant }}
          path: evidence/
          if-no-files-found: error
