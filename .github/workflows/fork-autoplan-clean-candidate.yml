name: Fork autoplan clean candidate

# Fork-only packaging and validation. This workflow is NOT part of the fix PR.
on:
  push:
    branches: [prepare/autoplan-prefix-2921-20260924]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-autoplan-clean-candidate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NO_COLOR: '1'

jobs:
  package:
    if: github.repository == 'kvnloo/gstack'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 181ac1f858d1d82182acc1dcdababd4865d6f236
          fetch-depth: 0
      - name: Package only the reviewed source change and regression tests
        id: package
        run: |
          base=06ed920a974809ebedc6bcbbe402fb81f5944598
          target=fix/autoplan-prefixed-methodology-2921
          inputs="$RUNNER_TEMP/autoplan-inputs"
          mkdir -p "$inputs"
          test "$(git hash-object .context/autoplan-prefix/source-only.patch)" = a34dfebbbd4622d95a350380454527015043f2bf
          test "$(git hash-object test/autoplan-methodology-prefix.test.ts)" = 9e8b8a8e8405407006956c6ef20bb12e3f3b932c
          cp .context/autoplan-prefix/source-only.patch "$inputs/source-only.patch"
          cp test/autoplan-methodology-prefix.test.ts "$inputs/regression.test.ts"
          timeout 120s git fetch --no-tags https://github.com/garrytan/gstack.git "$base"
          git switch --detach "$base"
          test "$(git hash-object bin/gstack-autoplan-snapshot.ts)" = 7a0f3344f6a9c7899be6a8394996668a442d6a41
          test "$(git hash-object bin/gstack-patch-names)" = bef02aae4c0b3ccce7b1983a977c475c1a629186
          git apply --check "$inputs/source-only.patch"
          git apply "$inputs/source-only.patch"
          cp "$inputs/regression.test.ts" test/autoplan-methodology-prefix.test.ts
          git diff --check
          git add -- bin/gstack-autoplan-snapshot.ts test/autoplan-methodology-prefix.test.ts
          printf '%s\n' bin/gstack-autoplan-snapshot.ts test/autoplan-methodology-prefix.test.ts > "$inputs/expected-files"
          git diff --cached --name-only > "$inputs/actual-files"
          diff -u "$inputs/expected-files" "$inputs/actual-files"
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(autoplan): accept prefixed methodology skill names' -m 'Based on josimarguilbaud\x27s diagnosis and narrow fix suggestion in #2921. Preserve exact source bytes and snapshot integrity; accept only the two supported names for each phase. AI-assisted implementation and regression tests.'
          remote=$(git ls-remote --heads origin "refs/heads/$target")
          if [[ -n "$remote" ]]; then
            existing=${remote%%$'\t'*}
            git fetch --no-tags origin "$existing"
            test "$(git rev-parse "$existing^{tree}")" = "$(git rev-parse HEAD^{tree})"
            git switch --detach "$existing"
          else
            # An empty lease creates only an absent ref; it never replaces a branch.
            git push --force-with-lease="refs/heads/$target:" origin "HEAD:refs/heads/$target"
          fi
          commit=$(git rev-parse HEAD)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'Base: `%s`\n\nCandidate: `%s`\n\nBranch: `%s`\n' "$base" "$commit" "$target" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat "$base" HEAD >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: package
    if: github.repository == 'kvnloo/gstack'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GSTACK_FREE_JOBS: '2'
      GSTACK_EXPECT_BINARIES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.package.outputs.commit }}
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Record the exact candidate and install frozen dependencies
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/candidate-commit.txt
          git rev-parse HEAD^ > validation/base-commit.txt
          git diff HEAD^ HEAD > validation/candidate.patch
          bun --version > validation/bun-version.txt
          bun install --frozen-lockfile
      - name: Require the same discrimination test on the new base
        run: |
          git show HEAD^:bin/gstack-autoplan-snapshot.ts > bin/gstack-autoplan-snapshot.ts
          set +e
          bun test test/autoplan-methodology-prefix.test.ts 2>&1 | tee validation/before.log
          result=${PIPESTATUS[0]}
          set -e
          git restore --source=HEAD -- bin/gstack-autoplan-snapshot.ts
          test "$result" -eq 1
          grep -Eq '^[[:space:]]*20 pass[[:space:]]*$' validation/before.log
          grep -Eq '^[[:space:]]*28 fail[[:space:]]*$' validation/before.log
          if grep -Eq '^[[:space:]]*[1-9][0-9]* (skip|todo)|errors? between tests' validation/before.log; then exit 1; fi
          bun test test/autoplan-methodology-prefix.test.ts 2>&1 | tee validation/after.log
          grep -Eq '^[[:space:]]*48 pass[[:space:]]*$' validation/after.log
          grep -Eq '^[[:space:]]*0 fail[[:space:]]*$' validation/after.log
          if grep -Eq '^[[:space:]]*[1-9][0-9]* (skip|todo)|errors? between tests' validation/after.log; then exit 1; fi
          git diff --exit-code -- bin/gstack-autoplan-snapshot.ts test/autoplan-methodology-prefix.test.ts
      - name: Run adjacent native tests
        run: |
          git config --global user.name 'Fork Validation'
          git config --global user.email 'fork-validation@gstack.test'
          git config --global init.defaultBranch main
          bun test test/autoplan-snapshot.test.ts test/autoplan-init.test.ts test/autoplan-amend-input.test.ts 2>&1 | tee validation/adjacent.log
      - name: Build prerequisites for the full free suite
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils poppler-utils fonts-noto-color-emoji
          bun run gen:skill-docs --host all
          bun run vendor:xterm
          bash browse/scripts/build-node-server.sh
          bun run build:gates
          bun run build:cso
      - name: Exercise real setup in a disposable home, in both prefix modes
        run: |
          scratch=$(mktemp -d "$RUNNER_TEMP/autoplan-install.XXXXXX")
          install="$scratch/.claude/skills/gstack"
          mkdir -p "$(dirname "$install")"
          git clone --shared --no-hardlinks "$GITHUB_WORKSPACE" "$install"
          git -C "$install" checkout --detach "$(cat validation/candidate-commit.txt)"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$install/node_modules"
          for mode in prefix no-prefix; do
            (
              export HOME="$scratch"
              export XDG_CONFIG_HOME="$scratch/.config"
              export XDG_CACHE_HOME="$scratch/.cache"
              export GSTACK_SKIP_PLAYWRIGHT=1 GSTACK_SKIP_ASIDE=1
              cd "$install"
              timeout 300s bash ./setup --host claude --no-team --no-plan-tune-hooks --no-timeline-stop-hook "--$mode" </dev/null
              for phase in ceo design dx eng; do
                name="plan-$phase-review"
                if [[ "$phase" == dx ]]; then name=plan-devex-review; fi
                expected="$name"
                if [[ "$mode" == prefix ]]; then expected="gstack-$name"; fi
                grep -Fx "name: $expected" "$install/$name/SKILL.md"
                restore="$scratch/$mode-$phase-restore.md"
                printf 'Original plan.\n' > "$restore"
                timeout 30s bun bin/gstack-autoplan-snapshot.ts methodology "$phase" "$install/$name/SKILL.md" "$restore"
              done
            ) 2>&1 | tee "validation/setup-$mode.log"
          done
          git diff --exit-code -- bin/gstack-autoplan-snapshot.ts test/autoplan-methodology-prefix.test.ts
      - name: Run final full free acceptance on the frozen candidate
        run: |
          set +e
          xvfb-run -a bun run test 2>&1 | tee validation/full-free.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > validation/full-free-exit.txt
          exit "$result"
      - name: Preserve exact evidence and scope
        if: always()
        run: |
          mkdir -p validation
          printf '%s\n' 'Ubuntu 24.04 / Bun 1.4.0 only.' 'No paid model evaluations or live Claude UI session.' 'No native Windows or macOS validation in this workflow.' > validation/LIMITATIONS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: autoplan-clean-candidate-evidence
          path: validation/
          if-no-files-found: error
